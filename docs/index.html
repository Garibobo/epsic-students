import os

# HTML template with dynamic GitHub tree loading
html_content = """<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    h1 {
      margin: 0;
    }
    .container {
      padding: 20px;
    }
    .section h2 {
      color: #004080;
    }
    #qr-section img {
      width: 200px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    #qr-section img:hover {
      transform: scale(1.1);
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #004080;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0066cc;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      margin: 5px 0;
      cursor: pointer;
      color: #004080;
    }
    li:hover {
      text-decoration: underline;
    }
    .tree-item {
      margin-left: calc(var(--level) * 20px);
    }
  </style>
</head>
<body>
  <header>
    <img src="logo-2.png" alt="Logo EPSIC">
    <h1>EPSIC Students</h1>
  </header>
  <div class="container">
    <div class="section" id="qr-section">
      <h2>QR Code du site</h2>
      <a href="qr-github.png" target="_blank">
        <img src="qr-github.png" alt="QR Code">
      </a>
      <br>
      <a href="qr-github.png" download="qr-github.png">
        <button>Télécharger le QR code</button>
      </a>
    </div>
    <div class="section" id="navigation">
      <h2>Navigation</h2>
      <ul id="tree-view"></ul>
    </div>
  </div>
  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    async function fetchTree(path = "", level = 0) {
      const res = await fetch(apiBase + path);
      const data = await res.json();
      for (const item of data) {
        if (item.name.toLowerCase() === "readme.md" || item.path.startsWith("docs")) continue;
        const li = document.createElement("li");
        li.style.setProperty("--level", level);
        li.className = "tree-item";
        if (item.type === "dir") {
          li.textContent = "📁 " + item.name;
          document.getElementById("tree-view").appendChild(li);
          await fetchTree(item.path, level + 1);
        } else {
          let icon = "📄";
          if (/\.(png|jpg|jpeg|gif)$/i.test(item.name)) icon = "🖼️";
          else if (/\.pdf$/i.test(item.name)) icon = "📑";
          li.innerHTML = `${icon} <a href="${item.html_url}" target="_blank">${item.name}</a>`;
          document.getElementById("tree-view").appendChild(li);
        }
      }
    }

    fetchTree();
  </script>
</body>
</html>
