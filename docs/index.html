<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #333;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    h1 {
      margin: 0;
    }
    .container {
      padding: 20px;
    }
    .section {
      margin-bottom: 30px;
    }
    .section h2 {
      color: #004080;
    }
    #qr-section img {
      width: 200px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    #qr-section img:hover {
      transform: scale(1.1);
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #004080;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0066cc;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      margin: 5px 0;
      cursor: pointer;
      color: #004080;
    }
    li:hover {
      text-decoration: underline;
    }
    .indent {
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo-2.png" alt="Logo EPSIC">
    <h1>EPSIC Students</h1>
  </header>
  <div class="container">
    <div class="section" id="qr-section">
      <h2>QR Code du site</h2>
      <a href="qr-github.png" target="_blank">
        <img src="qr-github.png" alt="QR Code" id="qr-image">
      </a>
      <br>
      <a href="qr-github.png" download="qr-github.png">
        <button>Télécharger le QR code</button>
      </a>
    </div>
    <div class="section" id="navigation">
      <h2>Navigation</h2>
      <ul id="file-tree"></ul>
    </div>
  </div>
  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    function getIcon(name, type) {
      if (type === "dir") return "📁";
      if (name.match(/\\.pdf$/i)) return "📑";
      if (name.match(/\\.(jpg|jpeg|png|gif)$/i)) return "🖼️";
      return "📄";
    }

    async function loadTree(path = "", container = document.getElementById("file-tree"), level = 0) {
      const res = await fetch(apiBase + path);
      const data = await res.json();
      data.forEach(item => {
        if (item.name.toLowerCase() === "readme.md" || item.path.startsWith("docs")) return;
        const li = document.createElement("li");
        li.className = "indent";
        li.style.marginLeft = `${level * 20}px`;
        li.textContent = `${getIcon(item.name, item.type)} ${item.name}`;
        if (item.type === "dir") {
          li.onclick = () => {
            li.onclick = null;
            loadTree(item.path, container, level + 1);
          };
        } else {
          li.onclick = () => window.open(item.html_url, "_blank");
        }
        container.appendChild(li);
      });
    }

    loadTree("01-Administratif");
    loadTree("Cours");
  </script>
</body>
</html>
