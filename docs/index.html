<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    h1 {
      margin: 0;
    }
    .container {
      padding: 20px;
    }
    .section h2 {
      color: #004080;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      margin: 5px 0;
      cursor: pointer;
      color: #004080;
    }
    li:hover {
      text-decoration: underline;
    }
    .icon {
      margin-right: 8px;
    }
    #file-viewer {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo-2.png" alt="Logo EPSIC">
    <h1>EPSIC Students</h1>
  </header>
  <div class="container">
    <div class="section">
      <h2>QR Code du site</h2>
      <a href="qr-github.png" target="_blank">
        <img src="qr-github.png" alt="QR Code" style="width:200px;">
      </a>
      <br>
      <a href="qr-github.png" download="qr-github.png">
        <button>Télécharger le QR code</button>
      </a>
    </div>
    <div class="section">
      <h2>Navigation</h2>
      <ul id="navigation"></ul>
    </div>
  </div>
  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    function getIcon(name, type) {
      if (type === "dir") return "📁";
      if (name.endsWith(".pdf")) return "📑";
      if (name.match(/\.(jpg|jpeg|png|gif)$/i)) return "🖼️";
      return "📄";
    }

    async function loadFolder(path = "") {
      const res = await fetch(apiBase + path);
      const data = await res.json();
      const nav = document.getElementById("navigation");
      nav.innerHTML = "";
      data.forEach(item => {
        if (item.name.toLowerCase() === "readme.md" || item.path.startsWith("docs")) return;
        const li = document.createElement("li");
        li.innerHTML = `<span class="icon">${getIcon(item.name, item.type)}</span>${item.name}`;
        li.onclick = () => {
          if (item.type === "dir") {
            loadFolder(item.path);
          } else {
            window.open(item.html_url, "_blank");
          }
        };
        nav.appendChild(li);
      });
    }

    loadFolder();
  </script>
</body>
</html>
