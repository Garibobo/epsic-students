<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    h1 {
      margin: 0;
    }
    .container {
      padding: 20px;
    }
    .section h2 {
      color: #004080;
    }
    #qr-section img {
      width: 200px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    #qr-section img:hover {
      transform: scale(1.1);
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #004080;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0066cc;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      margin: 5px 0;
      cursor: pointer;
    }
    .indent-0 { margin-left: 0px; }
    .indent-1 { margin-left: 20px; }
    .indent-2 { margin-left: 40px; }
    .indent-3 { margin-left: 60px; }
    .indent-4 { margin-left: 80px; }
    .indent-5 { margin-left: 100px; }
    .indent-6 { margin-left: 120px; }
    .indent-7 { margin-left: 140px; }
  </style>
</head>
<body>
  <header>
    <img src="logo-2.png" alt="Logo EPSIC">
    <h1>EPSIC Students</h1>
  </header>
  <div class="container">
    <div class="section" id="qr-section">
      <h2>QR Code du site</h2>
      <a href="qr-github.png" target="_blank">
        <img src="qr-github.png" alt="QR Code">
      </a>
      <br>
      <a href="qr-github.png" download="qr-github.png">
        <button>Télécharger le QR code</button>
      </a>
    </div>
    <div class="section">
      <h2>Navigation</h2>
      <ul id="navigation"></ul>
    </div>
  </div>
  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    function getIcon(name, type) {
      if (type === "dir") return "📁";
      if (/\.(jpg|jpeg|png|gif)$/i.test(name)) return "🖼️";
      if (/\.pdf$/i.test(name)) return "📑";
      return "📄";
    }

    async function fetchTree(path = "", level = 0, parentUl) {
      try {
        const res = await fetch(apiBase + path);
        const data = await res.json();
        for (const item of data) {
          if (item.name.toLowerCase() === "readme.md" || item.path.startsWith("docs")) continue;
          const li = document.createElement("li");
          li.className = `indent-${Math.min(level, 7)}`;
          li.textContent = `${getIcon(item.name, item.type)} ${item.name}`;
          if (item.type === "file") {
            li.onclick = () => window.open(item.html_url, "_blank");
          }
          parentUl.appendChild(li);
          if (item.type === "dir") {
            const subUl = document.createElement("ul");
            parentUl.appendChild(subUl);
            await fetchTree(item.path, level + 1, subUl);
          }
        }
      } catch (e) {
        console.error("Erreur lors du chargement :", e);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const nav = document.getElementById("navigation");
      fetchTree("", 0, nav);
    });
  </script>
</body>
</html>
