<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students Explorer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #333;
    }
    header {
      background: #005a9c;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-container {
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 10px;
    }
    nav {
      display: flex;
      align-items: center;
    }
    nav select {
      padding: 5px;
      border-radius: 4px;
      border: none;
      margin-left: 10px;
    }
    .main {
      padding: 20px;
    }
    .tree {
      list-style-type: none;
      padding-left: 0;
    }
    .tree li {
      margin: 5px 0;
    }
    .tree li span {
      cursor: pointer;
      padding-left: 5px;
    }
    .indent-1 { margin-left: 20px; }
    .indent-2 { margin-left: 40px; }
    .indent-3 { margin-left: 60px; }
    .indent-4 { margin-left: 80px; }
    .indent-5 { margin-left: 100px; }
    .indent-6 { margin-left: 120px; }
    .indent-7 { margin-left: 140px; }
    .icon-folder::before {
      content: "📁 ";
    }
    .icon-file::before {
      content: "📄 ";
    }
    .icon-pdf::before {
      content: "📑 ";
    }
    .icon-img::before {
      content: "🖼️ ";
    }
    .download-btn {
      margin-top: 10px;
      display: inline-block;
      padding: 6px 12px;
      background: #005a9c;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
    .qr-section {
      text-align: center;
      margin: 20px;
    }
    .qr-section img {
      height: 200px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo-2.png" alt="Logo EPSIC">
      <h1 id="title">EPSIC Students</h1>
    </div>
    <nav>
      <label for="lang">🌐</label>
      <select id="lang" onchange="switchLanguage()">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </nav>
  </header>

  <div class="qr-section">
    <p>QR Code</p>
    <a href="qr-github.png" target="_blank">
      <img src="qr-github.png" alt="QR Code">
    </a>
    <br>
    <a href="qr-github.png" download class="download-btn">📥 Télécharger</a>
  </div>

  <div class="main">
    <h2 id="nav-title">Navigation</h2>
    <ul class="tree" id="file-tree"></ul>
  </div>

  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    async function fetchTree(path = "", level = 0) {
      const res = await fetch(apiBase + path);
      const data = await res.json();
      if (!Array.isArray(data)) return;

      for (const item of data) {
        if (item.name.toLowerCase() === "readme.md" || item.path.startsWith("docs")) continue;

        const li = document.createElement("li");
        li.className = `indent-${level}`;
        const span = document.createElement("span");

        if (item.type === "dir") {
          span.className = "icon-folder";
          span.textContent = item.name;
          li.appendChild(span);
          document.getElementById("file-tree").appendChild(li);
          await fetchTree(item.path, Math.min(level + 1, 7));
        } else {
          const ext = item.name.split('.').pop().toLowerCase();
          if (["png", "jpg", "jpeg", "gif"].includes(ext)) {
            span.className = "icon-img";
          } else if (ext === "pdf") {
            span.className = "icon-pdf";
          } else {
            span.className = "icon-file";
          }
          const link = document.createElement("a");
          link.href = item.html_url;
          link.target = "_blank";
          link.textContent = item.name;
          span.appendChild(link);
          li.appendChild(span);
          document.getElementById("file-tree").appendChild(li);
        }
      }
    }

    fetchTree();

    function switchLanguage() {
      const lang = document.getElementById('lang').value;
      if (lang === 'en') {
        document.getElementById('title').textContent = 'EPSIC Students';
        document.getElementById('nav-title').textContent = 'Navigation';
      } else {
        document.getElementById('title').textContent = 'EPSIC Students';
        document.getElementById('nav-title').textContent = 'Navigation';
      }
    }
  </script>
</body>
</html>
