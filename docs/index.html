<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students Explorer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #333;
    }
    header {
      background: #005a9c;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-container {
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 10px;
    }
    nav {
      display: flex;
      align-items: center;
    }
    nav select {
      padding: 5px;
      border-radius: 4px;
      border: none;
      margin-left: 10px;
    }
    .main {
      display: flex;
      height: calc(100vh - 60px);
    }
    #treeview {
      width: 30%;
      padding: 20px;
      overflow-y: auto;
      background: #f9f9f9;
      border-right: 1px solid #ccc;
    }
    #preview {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .folder, .file {
      margin: 5px 0;
      cursor: pointer;
      padding: 5px;
      border-radius: 4px;
    }
    .folder:hover, .file:hover {
      background: #e0e0e0;
    }
    .nested {
      margin-left: 20px;
      display: none;
    }
    .active {
      display: block;
    }
    .download-btn {
      margin-top: 10px;
      display: inline-block;
      padding: 6px 12px;
      background: #005a9c;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo-2.png" alt="Logo EPSIC">
      <h1 id="title">EPSIC Students</h1>
    </div>
    <nav>
      <label for="lang">🌐</label>
      <select id="lang" onchange="switchLanguage()">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </nav>
  </header>

  <div style="padding: 20px;">
    <p>QR Code</p>
    <a href="qr-github.png" target="_blank">
      <img src="qr-github.png" alt="QR Code" style="height: 150px;">
    </a>
    <br>
    <a href="qr-github.png" download class="download-btn">📥 Télécharger</a>
  </div>

  <div class="main">
    <div id="treeview">
      <h2 id="folders-title">Dossiers</h2>
      <div id="repo-tree">Chargement...</div>
    </div>
    <div id="preview">
      <h2 id="preview-title">Prévisualisation</h2>
      <iframe id="file-frame" src=""></iframe>
    </div>
  </div>

  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    async function fetchTree(path = "", container) {
      const res = await fetch(apiBase + path);
      const items = await res.json();
      items.forEach(item => {
        if (item.name.toLowerCase().includes("readme") || item.path.startsWith("docs")) return;
        const div = document.createElement("div");
        div.textContent = item.name;
        if (item.type === "dir") {
          div.className = "folder";
          const nested = document.createElement("div");
          nested.className = "nested";
          div.onclick = () => {
            nested.classList.toggle("active");
            if (!nested.hasChildNodes()) {
              fetchTree(item.path, nested);
            }
          };
          container.appendChild(div);
          container.appendChild(nested);
        } else {
          div.className = "file";
          div.onclick = () => {
            document.getElementById("file-frame").src = `https://github.com/${user}/${repo}/blob/main/${item.path}?raw=true`;
          };
          container.appendChild(div);
        }
      });
    }

    fetchTree("", document.getElementById("repo-tree"));

    function switchLanguage() {
      const lang = document.getElementById("lang").value;
      if (lang === "en") {
        document.getElementById("title").textContent = "EPSIC Students";
        document.getElementById("folders-title").textContent = "Folders";
        document.getElementById("preview-title").textContent = "Preview";
      } else {
        document.getElementById("title").textContent = "EPSIC Students";
        document.getElementById("folders-title").textContent = "Dossiers";
        document.getElementById("preview-title").textContent = "Prévisualisation";
      }
    }
  </script>
</body>
</html>
