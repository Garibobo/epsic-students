<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students Explorer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #333;
    }
    header {
      background: #005a9c;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-container {
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 10px;
    }
    nav {
      display: flex;
      align-items: center;
    }
    nav select {
      padding: 5px;
      border-radius: 4px;
      border: none;
      margin-left: 10px;
    }
    .main {
      padding: 20px;
    }
    ul {
      list-style-type: none;
      padding-left: 20px;
    }
    li {
      cursor: pointer;
      margin: 5px 0;
    }
    .folder {
      font-weight: bold;
      color: #005a9c;
    }
    .file {
      color: #333;
    }
    .qr-section {
      margin: 20px;
      text-align: center;
    }
    .qr-section img {
      height: 200px;
      cursor: pointer;
    }
    .download-btn {
      margin-top: 10px;
      display: inline-block;
      padding: 6px 12px;
      background: #005a9c;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo-2.png" alt="Logo EPSIC">
      <h1 id="title">EPSIC Students</h1>
    </div>
    <nav>
      <label for="lang">🌐</label>
      <select id="lang" onchange="switchLanguage()">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </nav>
  </header>

  <div class="qr-section">
    <p>QR Code</p>
    <a href="qr-github.png" target="_blank">
      <img src="qr-github.png" alt="QR Code">
    </a>
    <br>
    <a href="qr-github.png" download class="download-btn">📥 Télécharger</a>
  </div>

  <div class="main">
    <h2 id="folders-title">Dossiers</h2>
    <ul id="tree-root"></ul>
  </div>

  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    async function fetchTree(path, parentElement, level = 0) {
      if (level > 6) return;
      const res = await fetch(apiBase + path);
      const data = await res.json();
      data.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item.name;
        if (item.type === "dir") {
          li.className = "folder";
          const subUl = document.createElement("ul");
          li.onclick = async (e) => {
            e.stopPropagation();
            if (subUl.childElementCount === 0) {
              await fetchTree(item.path, subUl, level + 1);
            } else {
              subUl.innerHTML = "";
            }
          };
          li.appendChild(subUl);
        } else {
          li.className = "file";
          li.onclick = () => {
            window.open(item.html_url, "_blank");
          };
        }
        parentElement.appendChild(li);
      });
    }

    fetchTree("", document.getElementById("tree-root"));

    function switchLanguage() {
      const lang = document.getElementById('lang').value;
      if (lang === 'en') {
        document.getElementById('title').textContent = 'EPSIC Students';
        document.getElementById('folders-title').textContent = 'Folders';
      } else {
        document.getElementById('title').textContent = 'EPSIC Students';
        document.getElementById('folders-title').textContent = 'Dossiers';
      }
    }
  </script>
</body>
</html>
