html_content = """<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #333;
    }
    header {
      background: #005a9c;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-container {
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 10px;
    }
    nav select {
      padding: 5px;
      border-radius: 4px;
      border: none;
      margin-left: 10px;
    }
    .main {
      padding: 20px;
    }
    .item {
      cursor: pointer;
      margin: 10px 0;
      padding: 8px;
      border-radius: 4px;
      transition: background 0.2s;
      background: #f0f0f0;
    }
    .item:hover {
      background: #e0e0e0;
    }
    .download-btn {
      margin-top: 10px;
      display: inline-block;
      padding: 6px 12px;
      background: #005a9c;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
    .qr-section {
      text-align: center;
      margin: 20px;
    }
    .qr-section img {
      height: 200px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .qr-section img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo-2.png" alt="Logo EPSIC">
      <h1 id="title">EPSIC Students</h1>
    </div>
    <nav>
      <label for="lang">🌐</label>
      <select id="lang" onchange="switchLanguage()">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </nav>
  </header>

  <div class="qr-section">
    <p>QR Code</p>
    <a href="qr-github.png" target="_blank">
      <img src="qr-github.png" alt="QR Code">
    </a>
    <br>
    <a href="qr-github.png" download class="download-btn">📥 Télécharger</a>
  </div>

  <div class="main">
    <h2 id="folders-title">Dossiers</h2>
    <div id="folder-list">Chargement...</div>
  </div>

  <script>
    const repo = "epsic-students";
    const user = "Garibobo";
    const folders = ["00-Administratif", "01-Cours"];
    const folderList = document.getElementById("folder-list");

    async function loadFiles(folder) {
      const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`);
      const data = await res.json();
      folderList.innerHTML = `<h3>${folder}</h3>`;
      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `📄 <a href="${item.html_url}" target="_blank">${item.name}</a>`;
        folderList.appendChild(div);
      });
    }

    function switchLanguage() {
      const lang = document.getElementById("lang").value;
      if (lang === "en") {
        document.getElementById("title").textContent = "EPSIC Students";
        document.getElementById("folders-title").textContent = "Folders";
      } else {
        document.getElementById("title").textContent = "EPSIC Students";
        document.getElementById("folders-title").textContent = "Dossiers";
      }
    }

    async function init() {
      folderList.innerHTML = "";
      for (const folder of folders) {
        await loadFiles(folder);
      }
    }

    init();
  </script>
</body>
</html>
