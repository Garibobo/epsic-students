
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EPSIC Students</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #004080;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        header img {
            height: 40px;
            margin-right: 15px;
        }
        h1 {
            margin: 0;
        }
        .container {
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            color: #004080;
        }
        #qr-section img {
            width: 200px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        #qr-section img:hover {
            transform: scale(1.1);
        }
        #file-viewer {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
            background-color: #f9f9f9;
        }
        button {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #004080;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0066cc;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        li {
            margin: 5px 0;
            cursor: pointer;
            color: #004080;
        }
        li:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo-2.png" alt="Logo EPSIC">
        <h1>EPSIC Students</h1>
    </header>
    <div class="container">
        <div class="section" id="qr-section">
            <h2>QR Code du site</h2>
            <img src="qr-github.png" alt="QR Code" id="qr-image">
            <br>
            <a href="qr-github.png" download="qr-github.png">
                <button>Télécharger le QR code</button>
            </a>
        </div>
        <div class="section" id="navigation">
            <h2>Navigation dans les dossiers</h2>
            <ul id="folders">
                <li onclick="loadFolder('Administratif')">📁 Administratif</li>
                <li onclick="loadFolder('Cours')">📁 Cours</li>
            </ul>
            <ul id="files"></ul>
            <div id="file-viewer"></div>
        </div>
    </div>
    <script>
        const repo = "epsic-students";
        const user = "garibobo";
        const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

        async function loadFolder(folder) {
            const res = await fetch(apiBase + folder);
            const data = await res.json();
            const filesList = document.getElementById("files");
            filesList.innerHTML = "";
            data.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item.name;
                li.onclick = () => loadFile(item.path);
                filesList.appendChild(li);
            });
        }

        async function loadFile(path) {
            const res = await fetch(apiBase + path);
            const data = await res.json();
            const content = atob(data.content);
            document.getElementById("file-viewer").textContent = content;
        }
    </script>
</body>
</html>
