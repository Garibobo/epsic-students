<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 15px;
    }
    h1 {
      margin: 0;
    }
    .container {
      padding: 20px;
    }
    .section h2 {
      color: #004080;
    }
    #qr-section img {
      width: 200px;
      cursor: pointer;
    }
    #navigation {
      margin-top: 30px;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      margin: 5px 0;
      cursor: pointer;
    }
    .folder {
      color: #004080;
    }
    .file {
      color: #333;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo-2.png" alt="Logo EPSIC">
    <h1>EPSIC Students</h1>
  </header>
  <div class="container">
    <div class="section" id="qr-section">
      <h2>QR Code du site</h2>
      <a href="qr-github.png" target="_blank">
        <img src="qr-github.png" alt="QR Code">
      </a>
      <br>
      <a href="qr-github.png" download="qr-github.png">
        <button>Télécharger le QR code</button>
      </a>
    </div>
    <div class="section" id="navigation">
      <h2>Navigation</h2>
      <ul id="tree"></ul>
    </div>
  </div>
  <script>
    const user = "garibobo";
    const repo = "epsic-students";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    async function fetchTree(path = "", level = 0) {
      try {
        const res = await fetch(apiBase + path);
        const data = await res.json();
        if (!Array.isArray(data)) return;

        const ul = document.createElement("ul");
        ul.style.paddingLeft = `${20 * level}px`;

        for (const item of data) {
          if (item.name.toLowerCase() === "readme.md" || item.path.startsWith("docs")) continue;

          const li = document.createElement("li");
          li.textContent = item.name;

          if (item.type === "dir") {
            li.className = "folder";
            ul.appendChild(li);
            const subTree = await fetchTree(item.path, level + 1);
            if (subTree) ul.appendChild(subTree);
          } else {
            li.className = "file";
            li.onclick = () => window.open(item.html_url, "_blank");
            ul.appendChild(li);
          }
        }
        return ul;
      } catch (error) {
        console.error("Erreur lors du chargement :", error);
      }
    }

    async function initTree() {
      const treeContainer = document.getElementById("tree");
      const tree = await fetchTree();
      if (tree) treeContainer.appendChild(tree);
    }

    initTree();
  </script>
</body>
</html>
