<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EPSIC Students</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #333;
    }
    header {
      background: #005a9c;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-container {
      display: flex;
      align-items: center;
    }
    header img {
      height: 40px;
      margin-right: 10px;
    }
    nav {
      display: flex;
      align-items: center;
    }
    nav select {
      padding: 5px;
      border-radius: 4px;
      border: none;
      margin-left: 10px;
    }
    .main {
      padding: 20px;
    }
    .item {
      cursor: pointer;
      margin: 5px 0;
      padding: 6px;
      border-radius: 4px;
      transition: background 0.2s;
      color: #005a9c;
    }
    .item:hover {
      background: #e0e0e0;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
    .qr-section {
      text-align: center;
      margin: 20px;
    }
    .qr-section img {
      height: 200px;
      cursor: pointer;
    }
    .download-btn {
      margin-top: 10px;
      display: inline-block;
      padding: 6px 12px;
      background: #005a9c;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo-2.png" alt="Logo EPSIC">
      <h1 id="title">EPSIC Students</h1>
    </div>
    <nav>
      <label for="lang">🌐</label>
      <select id="lang" onchange="switchLanguage()">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </nav>
  </header>

  <div class="qr-section">
    <p>QR Code</p>
    <a href="qr-github.png" target="_blank">
      <img src="qr-github.png" alt="QR Code">
    </a>
    <br>
    <a href="qr-github.png" download class="download-btn">📥 Télécharger</a>
  </div>

  <div class="main">
    <h2 id="folders-title">Dossiers</h2>
    <div id="folder-list"></div>
    <iframe id="viewer" src=""></iframe>
  </div>

  <script>
    const repo = "epsic-students";
    const user = "garibobo";
    const apiBase = `https://api.github.com/repos/${user}/${repo}/contents/`;

    const folderMap = {
      "01-Administratif": "Administratif",
      "Cours": "Cours"
    };

    async function fetchFolder(path, container, level = 0) {
      const res = await fetch(apiBase + path);
      const data = await res.json();
      data.forEach(item => {
        if (item.name.toLowerCase().includes("readme") || item.path.startsWith("docs")) return;
        const div = document.createElement("div");
        div.className = "item";
        div.style.marginLeft = `${level * 20}px`;
        if (item.type === "dir") {
          div.textContent = "📁 " + item.name;
          div.onclick = () => fetchFolder(item.path, container, level + 1);
        } else {
          div.textContent = "📄 " + item.name;
          div.onclick = () => {
            const viewer = document.getElementById("viewer");
            viewer.src = `https://github.com/${user}/${repo}/blob/main/${item.path}?raw=true`;
          };
        }
        container.appendChild(div);
      });
    }

    window.onload = () => {
      const container = document.getElementById("folder-list");
      Object.keys(folderMap).forEach(folder => {
        const title = document.createElement("div");
        title.className = "item";
        title.textContent = "📁 " + folderMap[folder];
        title.onclick = () => fetchFolder(folder, container);
        container.appendChild(title);
      });
    };

    function switchLanguage() {
      const lang = document.getElementById("lang").value;
      if (lang === "en") {
        document.getElementById("title").textContent = "EPSIC Students";
        document.getElementById("folders-title").textContent = "Folders";
      } else {
        document.getElementById("title").textContent = "EPSIC Students";
        document.getElementById("folders-title").textContent = "Dossiers";
      }
    }
  </script>
</body>
</html>
